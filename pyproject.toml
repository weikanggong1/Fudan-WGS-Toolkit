[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fudan-wgs-toolkit"
version = "0.13.0"
description = "Fudan WGS Toolkit: Python GPU association analysis for binary or continuous phenotypes"
requires-python = ">=3.10"
license = {text = "GPL-3.0-only"}
dependencies = ["numpy>=1.26,<2", "pandas>=1.4", "scipy>=1.13", "torch>=2.4", "zstandard>=0.22", "triton>=3.0; platform_system == 'Linux'"]

[project.optional-dependencies]
test = ["pytest>=7"]
parquet = ["pyarrow>=12"]
annotations = ["rdata==0.11.2"]

[project.scripts]
fudan-wgs = "fudan_wgs_toolkit.run:main"
prepare-WGS-data = "fudan_wgs_toolkit.prepare:main"
run-WGS-all-binanry = "fudan_wgs_toolkit.run:main"
run-WGS-continuous = "fudan_wgs_toolkit.continuous_run:main"
generate_simulated_data = "fudan_wgs_toolkit.simulate:main"
single_subj_preprocessing = "fudan_wgs_toolkit.single_preprocessing:main"
build-preprocessing-hc-guard = "fudan_wgs_toolkit.build_preprocessing_hc_guard:main"

[tool.setuptools.packages.find]
include = ["fudan_wgs_toolkit*"]

[tool.setuptools.package-data]
"fudan_wgs_toolkit._preprocessing_runtime_assets" = ["*.java"]
"fudan_wgs_toolkit._preprocessing_fastp" = ["*.patch", "*.cpp", "*.json", "FASTP_LICENSE", "SOURCES.md"]
"fudan_wgs_toolkit._preprocessing_bqsr" = ["assets/**/*.java", "source_manifest.json", "SOURCES.md", "README.zh.md"]
"fudan_wgs_toolkit._preprocessing_gpu" = ["assets/**/*", "*.json", "SOURCES.md", "THIRD_PARTY_NOTICES.md"]

"fudan_wgs_toolkit._preprocessing_gatk_sourcepatch" = ["assets/*.patch", "assets/*.java", "source_manifest.json", "LICENSE.GATK-4.2.0.0.txt", "SOURCES.md", "README.zh.md"]
"fudan_wgs_toolkit._preprocessing_bwa" = ["*.patch", "*.c", "*.json", "BWA_COPYING", "SOURCES.md", "version_probe.py"]

"fudan_wgs_toolkit._preprocessing_hc_guard" = ["assets/*.java", "source_manifest.json", "SOURCES.md"]
